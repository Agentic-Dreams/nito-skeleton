name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint --if-present

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET: test-secret-minimum-32-characters-long
          FRONTEND_URL: http://localhost:4200
          PORT: 3000
          NODE_ENV: test
        run: npm test

      - name: Run e2e tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          JWT_SECRET: test-secret-minimum-32-characters-long
          FRONTEND_URL: http://localhost:4200
          PORT: 3000
          NODE_ENV: test
        run: npm run test:e2e --if-present

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t nito-skeleton:${{ github.sha }} .
          docker tag nito-skeleton:${{ github.sha }} nito-skeleton:latest

  deploy-dev:
    runs-on: self-hosted
    needs: [test, build]
    if: github.ref == 'refs/heads/dev'
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to development
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_DEV }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL_DEV }}
          PORT: 3000
        run: |
          docker build -t nito-skeleton:dev .
          docker stop nito-skeleton-dev || true
          docker rm nito-skeleton-dev || true
          docker run -d \
            --name nito-skeleton-dev \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.nito-dev.rule=Host(\`${{ secrets.DEV_DOMAIN }}\`)" \
            --label "traefik.http.routers.nito-dev.tls=true" \
            --label "traefik.http.routers.nito-dev.tls.certresolver=letsencrypt" \
            --network traefik-public \
            -e DATABASE_URL \
            -e JWT_SECRET \
            -e FRONTEND_URL \
            -e PORT \
            -e NODE_ENV=development \
            nito-skeleton:dev

  deploy-prod:
    runs-on: self-hosted
    needs: [test, build]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_PROD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET_PROD }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL_PROD }}
          PORT: 3000
        run: |
          docker build -t nito-skeleton:prod .
          docker stop nito-skeleton-prod || true
          docker rm nito-skeleton-prod || true
          docker run -d \
            --name nito-skeleton-prod \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.nito-prod.rule=Host(\`${{ secrets.PROD_DOMAIN }}\`)" \
            --label "traefik.http.routers.nito-prod.tls=true" \
            --label "traefik.http.routers.nito-prod.tls.certresolver=letsencrypt" \
            --network traefik-public \
            -e DATABASE_URL \
            -e JWT_SECRET \
            -e FRONTEND_URL \
            -e PORT \
            -e NODE_ENV=production \
            nito-skeleton:prod
